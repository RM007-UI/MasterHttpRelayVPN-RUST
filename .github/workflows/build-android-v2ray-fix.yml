name: Build Android APK (V2Ray upstream fix)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.2.11394342
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/26.2.11394342

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-v2ray-upstream-fix
          cache-bin: "false"
          workspaces: |
            . -> target

      - name: Install Android NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.2.11394342"
          cargo install cargo-ndk --locked

      - name: Build release APKs
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mhrv-rs-v2ray-fix-apks
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
